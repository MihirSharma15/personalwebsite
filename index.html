<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mihir Sharma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #f4eee0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      touch-action: none;
    }
    .links {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, calc(100vw - 40px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'EB Garamond', Garamond, Georgia, serif;
      font-size: 14px;
      color: #2a1a0a;
      z-index: 10;
      pointer-events: none;
      padding: 0 45px;
    }
    .links a {
      color: #2a1a0a;
      text-decoration: none;
      pointer-events: auto;
      opacity: 0.6;
      letter-spacing: 0.02em;
      transition: opacity 0.15s;
      padding: 4px 12px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    /* Guarded on (hover: hover): a tap fires mouseenter with no matching
       mouseleave, so on touch the hover styling would stick after navigating. */
    @media (hover: hover) {
      .links a:hover {
        opacity: 1;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
    }
    @media (max-width: 600px) {
      .links {
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        bottom: 14px;
        padding: 0 24px;
        font-size: 13px;
      }
    }
    .section-nav {
      position: fixed;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      width: min(700px, calc(100vw - 40px));
      display: flex;
      justify-content: flex-end;
      font-family: 'EB Garamond', Garamond, Georgia, serif;
      z-index: 10;
      pointer-events: none;
      padding: 0 45px;
    }
    .section-nav .nav-links {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 26px;
      pointer-events: auto;
    }
    .section-nav a {
      position: relative;
      color: #2a1a0a;
      text-decoration: none;
      opacity: 0.6;
      font-size: 14px;
      letter-spacing: 0.02em;
      transition: opacity 0.15s, color 0.15s;
    }
    @media (hover: hover) {
      .section-nav a:hover {
        opacity: 1;
        color: #c4402a;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
    }
    .nav-toggle,
    .nav-scrim { display: none; }

    /* On narrow screens the dragon coils through the top-left of the page and
       collides with the inline nav, so the links move into a drawer behind a
       hamburger pinned to the opposite corner. */
    @media (max-width: 600px) {
      .nav-toggle {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 40;
        width: 40px;
        height: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 0;
        border: none;
        border-radius: 10px;
        background: rgba(244, 238, 224, 0.6);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .nav-toggle span {
        display: block;
        width: 18px;
        height: 1.5px;
        background: #2a1a0a;
        opacity: 0.75;
        transition: transform 0.25s ease, opacity 0.2s ease;
      }
      body.nav-open .nav-toggle span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
      body.nav-open .nav-toggle span:nth-child(2) { opacity: 0; }
      body.nav-open .nav-toggle span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

      .nav-scrim {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(42, 26, 10, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      body.nav-open .nav-scrim {
        opacity: 1;
        pointer-events: auto;
      }

      .section-nav {
        top: 0;
        left: auto;
        right: 0;
        width: min(260px, 78vw);
        height: 100%;
        padding: 0;
        z-index: 30;
        background: #f4eee0;
        border-left: 1px solid rgba(42, 26, 10, 0.12);
        box-shadow: -8px 0 24px rgba(42, 26, 10, 0.1);
        transform: translateX(100%);
        transition: transform 0.28s ease;
      }
      body.nav-open .section-nav { transform: translateX(0); }
      .section-nav .nav-links {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        width: 100%;
        padding: 78px 26px 0;
      }
      .section-nav a {
        width: 100%;
        padding: 11px 0;
        font-size: 17px;
        opacity: 0.75;
      }
    }
  </style>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <canvas id="manuscript"></canvas>
  <button class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="section-nav">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-scrim"></div>
  <nav class="section-nav" id="section-nav">
    <div class="nav-links">
      <a href="/" data-route="home">Home</a>
      <a href="/travel" data-route="travel">Travel</a>
      <a href="/whats-next" data-route="whats-next">What's Next</a>
      <a href="/blog" data-route="blog">Blog</a>
    </div>
  </nav>
  <nav class="links">
    <a href="mailto:mihirxsharma15@gmail.com">mihirxsharma15 [at] gmail [dot] com</a>
    <a href="https://www.linkedin.com/in/MihirSharma15" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://x.com/mihirsharma2005" target="_blank" rel="noopener">X</a>
  </nav>
</body>
</html>
